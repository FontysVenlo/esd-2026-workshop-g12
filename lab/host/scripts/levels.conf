# levels.conf -- definition of every escape level.
#
# Sourced by launch.sh, which runs INSIDE the DinD "host" container. Each level
# is just the vulnerable image (vuln:latest) started with a specific set of
# dangerous `docker run` flags. Change a level here and it changes everywhere;
# no other file needs editing.
#
# The whole point of the workshop: the image is identical every time. Only these
# flags decide whether the container is a prison or an open door.

LEVELS="1 2 3 4 5 6 7"

# Title, shown in menus.
level_title() {
  case "$1" in
    1) echo "Bind-mounted host path      (-v /:/mnt/host)";;
    2) echo "Mounted Docker socket       (-v /var/run/docker.sock)";;
    3) echo "Exposed Docker API over TCP (dockerd on :2375)";;
    4) echo "Privileged + host PID ns    (--privileged --pid=host)";;
    5) echo "No --privileged, just caps   (--cap-add=SYS_ADMIN,SYS_PTRACE --pid=host)";;
    6) echo "Unauth Engine API from a stock container (CVE-2025-9074)";;
    7) echo "One capability: CAP_DAC_READ_SEARCH      (open_by_handle_at)";;
    *) echo "unknown";;
  esac
}

# The dangerous run flags that make the level exploitable.
level_runargs() {
  case "$1" in
    1) echo "-v /:/mnt/host:ro";;
    2) echo "-v /var/run/docker.sock:/var/run/docker.sock";;
    3) echo "";;   # nothing mounted; the hole is the TCP daemon set up below
    4) echo "--privileged --pid=host";;
    5) echo "--cap-add=SYS_ADMIN --cap-add=SYS_PTRACE --security-opt apparmor=unconfined --pid=host";;
    # Level 6 (CVE-2025-9074)
    6) echo "";;
    7) echo "--cap-drop=ALL --cap-add=DAC_READ_SEARCH -v /srv/level7/share:/share:ro";;
    *) echo "";;
  esac
}

# Which user the vulnerable process runs as inside the container.
# Levels 1-2 are warm-ups and run as root. Level 3 starts as an unprivileged
# user to mimic "attacker got RCE as the app user". Levels 4-5 need root inside
# the container to use the capabilities, which is realistic for those bugs.
# Level 6 runs unprivileged on purpose - the CVE needed no privilege at all.
# Level 7 runs as root-in-container but with all caps dropped except one.
level_user() {
  case "$1" in
    3|6) echo "player";;
    *) echo "root";;
  esac
}

# Some levels need extra host-side setup before the container starts.
level_setup() {
  case "$1" in
    3)
      # Expose the host's Docker engine on an unauthenticated TCP port, the
      # single most common real-world Docker misconfiguration (thousands are
      # exposed to the public internet). We front the unix socket with socat so
      # we don't have to reconfigure dockerd itself.
      _expose_engine_api
      ;;
    6)
      # CVE-2025-9074 is a bug in the Docker Engine API that allows unauthenticated access to the API. 
      # We need to expose the API on TCP port 2375 for this level to be exploitable. 
      # This is the same as level 3, but the container starts unprivileged and the exploit is different.
      _expose_engine_api
      ;;
    7)
      # Level 7 is the open_by_handle_at capability abuse. It needs a small ext4
      # "data disk" to be built on the host and mounted into the container. The
      # flag is planted on that disk, and the container is given no other access
      # to the host filesystem. The escape is to open the disk's root by handle
      # and then open the flag relative to that root.
      _build_level7_disk
      ;;
    *) : ;;
  esac
}

# Helpers

# Expose the host's Docker Engine API on TCP port 2375, fronted by socat. This is
# the single most common real-world Docker misconfiguration (thousands are
# exposed to the public internet). We front the unix socket with socat so we don't have to reconfigure dockerd itself.
_expose_engine_api() {
  if ! pgrep -f "TCP-LISTEN:2375" >/dev/null 2>&1; then
    setsid socat TCP-LISTEN:2375,fork,reuseaddr UNIX-CONNECT:/var/run/docker.sock \
      >/tmp/socat-2375.log 2>&1 &
  fi
}

# Build a small ext4 "data disk" as a loopback filesystem and plant the flag on it.
_build_level7_disk() {
  local img=/srv/level7.img
  local mnt=/srv/level7
  mkdir -p "$mnt"
  if [ ! -e "$img" ]; then
    dd if=/dev/zero of="$img" bs=1M count=16 status=none
    mkfs.ext4 -q -F "$img"
  fi
  if ! mountpoint -q "$mnt"; then
    [ -e /dev/loop-control ] || mknod /dev/loop-control c 10 237
    local i
    for i in 0 1 2 3 4 5 6 7; do
      [ -e "/dev/loop$i" ] || mknod "/dev/loop$i" b 7 "$i"
    done
    mount -o loop "$img" "$mnt"
  fi
  mkdir -p "$mnt/share"
  # The flag was generated on the laptop and baked into /flags on this host.
  # Copy it onto the data disk as the app's "secret", reachable only via the escape.
  cp -f /flags/level7.txt "$mnt/secret.txt"
  chmod 600 "$mnt/secret.txt"
  chown root:root "$mnt/secret.txt"
  printf 'This directory is the only thing the container was given.\n' \
    > "$mnt/share/README.txt"
}
